<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1880946354382681" crossorigin="anonymous"></script>
<title>Parça Birleştir</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f7f4fb;--fg:#3b3a55;--card:#ffffff;--mut:#8a89a6;--shadow:0 2px 6px rgba(120,110,170,.15)}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;height:100%}
body{display:flex;flex-direction:column;align-items:center;padding:6px 10px;box-sizing:border-box}
.top{display:flex;align-items:center;width:100%;max-width:440px;gap:8px}
h1{font-size:20px;margin:0;font-weight:800;flex:1;text-align:center}
.back,.ic{background:var(--card);color:var(--fg);border-radius:12px;padding:9px 12px;font-weight:700;font-size:14px;text-decoration:none;border:0;font-family:inherit;min-width:64px;text-align:center;box-shadow:var(--shadow)}
.row{display:flex;gap:6px;width:100%;max-width:440px;justify-content:center;margin:3px 0}
.stat{flex:1;background:var(--card);border-radius:12px;padding:4px 2px;text-align:center;font-size:11px;color:var(--mut);box-shadow:var(--shadow)}
.stat b{display:block;font-size:16px;color:var(--fg)}
button{font:inherit;font-size:14px;font-weight:700;padding:9px 6px;border:0;border-radius:12px;background:var(--card);color:var(--fg);flex:1;box-shadow:var(--shadow)}
.seg button.on{background:#a9d0fb;color:#1f3f6e}
.act button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:7px 2px;line-height:1.1}
.act button i{font-style:normal;font-size:18px}
.act button.main{background:#f5a3b0;color:#5a1f2c}
.act button.rot{background:#c9b8f2;color:#3a2a6e}
#msg{min-height:18px;font-size:13px;text-align:center;margin:2px 0;color:var(--mut)}
svg{width:100%;max-width:440px;flex:1;min-height:0;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.piece{cursor:grab}
.pgw{width:100%;max-width:440px;height:6px;background:#e7e2f3;border-radius:3px;margin:2px 0 0;overflow:hidden}
#pg{height:100%;width:0;background:linear-gradient(90deg,#2d7bff,#19c24d);border-radius:3px;transition:width .25s}
#ov{display:none;position:fixed;inset:0;background:rgba(60,50,100,.35);align-items:center;justify-content:center;z-index:9}
#ov .card{background:#fff;border-radius:22px;padding:22px 24px;text-align:center;box-shadow:0 8px 30px rgba(60,50,100,.3);max-width:300px;width:80%}
#ov .st{font-size:34px;letter-spacing:4px}#ov p{margin:6px 0;color:var(--mut);font-size:14px}#ov b{color:var(--fg)}
#ad{display:none;position:fixed;inset:0;background:rgba(247,244,251,.97);z-index:20;flex-direction:column;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
#ad small{color:var(--mut);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px}
#adbox{width:100%;max-width:340px;min-height:250px;background:#fff;border-radius:16px;box-shadow:var(--shadow);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:13px}
#adc{margin-top:60px;flex:0;min-width:160px;max-width:220px;opacity:.5}
#adc.on{opacity:1;background:#f5a3b0;color:#5a1f2c}
#ov .bt{display:flex;gap:8px;margin-top:14px}
</style></head><body>
<div class="top"><a class="back" href="https://mugol-portal.github.io/mugol-.iq/" target="_top" rel="noopener">‹ Geri</a><h1>🔺 Parça Birleştir</h1><button class="ic" id="sb" style="flex:0">🔊</button></div>
<div class="row seg" id="seg"><button data-d="kolay">Kolay</button><button data-d="orta" class="on">Orta</button><button data-d="zor">Zor</button></div>
<div class="row"><div class="stat">Süre<b id="t">0:00</b></div><div class="stat">Hamle<b id="m">0</b></div><div class="stat">En iyi<b id="b">–</b></div><div class="stat">Çözülen<b id="n">0</b></div></div>
<div class="pgw"><div id="pg"></div></div>
<div id="msg"></div>
<svg id="s" viewBox="0 0 400 640"></svg>
<div class="row act"><button id="hb"><i>💡</i>İpucu</button><button id="ub"><i>↩</i>Geri al</button><button id="ro" class="rot"><i>⟳</i>Döndür</button><button id="db"><i>📅</i>Günlük</button><button id="rb"><i>↺</i>Sıfırla</button><button id="nb" class="main"><i>＋</i>Yeni</button></div>
<div id="ov"><div class="card"><div class="st" id="ovs"></div><p id="ovt"></p><div class="bt"><button id="ovc">Kapat</button><button id="ovn" class="main" style="background:#f5a3b0;color:#5a1f2c">Sonraki ▸</button></div></div></div>
<div id="ad"><small>Reklam</small><div id="adbox"></div><button id="adc" disabled>Kapat (5)</button></div>
<script>
const S=74,H=S*Math.sqrt(3)/2,BX=200-2.5*S,BY=16,N=2,NS="http://www.w3.org/2000/svg",R3=Math.sqrt(3)/2;
const COLORS=["#ff3b4e","#2d7bff","#ffc400","#19c24d","#a43bff","#ff7a00","#00bfae","#ff3fa4"];
const CFG={kolay:{k:4,min:3,max:8,scr:false,goal:60},orta:{k:6,min:3,max:7,scr:true,goal:120},zor:{k:8,min:2,max:6,scr:true,goal:180}};
const svg=document.getElementById('s'),msg=document.getElementById('msg'),$=id=>document.getElementById(id);
let diff='orta',daily=false,rnd=Math.random,cells,pieces,occ,regs,startT,penalty,moves,hints,won,hintG,stack=[],snd=true,ac,sel=null,trayY=0,trayH=0;
const key=(r,c)=>r+','+c,isUp=(r,c)=>(r+c)%2===0,fmt=t=>{t=Math.floor(t);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')};
const bkey=()=>'best_'+(daily?'gunluk':diff);
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
function mb(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function tone(f,d=.08,dl=0){if(!snd)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;g.gain.value=.08;o.connect(g);g.connect(ac.destination);const t=ac.currentTime+dl;o.start(t);o.stop(t+d)}catch(e){}}
function mk(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p&&p.appendChild(e);return e}
function pts(r,c){const x=BX+c*S/2,y=BY+r*H,y1=y+H;return(isUp(r,c)?[[x,y1],[x+S,y1],[x+S/2,y]]:[[x,y],[x+S,y],[x+S/2,y1]]).map(p=>p.join(',')).join(' ')}
function nbrs(r,c){return[[r,c-1],[r,c+1],isUp(r,c)?[r+1,c]:[r-1,c]]}
function boardCells(){const a=[];for(let r=0;r<2*N;r++){const n=2*N+1+2*Math.min(r,2*N-1-r),st=r<N?N-r:r-N+1;for(let i=0;i<n;i++)a.push([r,st+i])}return a}
function partition(){
 const cf=CFG[diff],set=new Set(cells.map(c=>key(...c)));
 for(let tries=0;;tries++){
  const mn=tries>300?1:cf.min,mx=tries>300?24:cf.max;
  const own=new Map(),rg=[];
  [...cells].sort(()=>rnd()-.5).slice(0,cf.k).forEach((c,i)=>{own.set(key(...c),i);rg.push([c])});
  while(own.size<cells.length){
   const o=[];rg.forEach((g,i)=>g.forEach(c=>nbrs(...c).forEach(n=>{const k=key(...n);if(set.has(k)&&!own.has(k))o.push([i,n])})));
   const[i,n]=o[Math.floor(rnd()*o.length)];own.set(key(...n),i);rg[i].push(n);
  }
  if(rg.every(r=>r.length>=mn&&r.length<=mx))return rg;
 }
}
function rot(p){
 const q=p.cells.map(([r,c])=>({x:(c+1)*S/2,y:r*H+(isUp(r,c)?2*H/3:H/3)}));
 const mx=q.reduce((a,b)=>a+b.x,0)/q.length,my=q.reduce((a,b)=>a+b.y,0)/q.length;
 let px=0,py=0,bd=1e9;const k0=Math.round(mx/(S/2)),j0=Math.round(my/H);
 for(let k=k0-2;k<=k0+2;k++)for(let j=j0-2;j<=j0+2;j++){if(((k+j)%2+2)%2!==1)continue;const d=Math.hypot(k*S/2-mx,j*H-my);if(d<bd){bd=d;px=k*S/2;py=j*H}}
 p.cells=q.map(({x,y})=>{const dx=x-px,dy=y-py,nx=px+dx*.5-dy*R3,ny=py+dx*R3+dy*.5;return[Math.floor(ny/H+1e-6),Math.round(nx/(S/2)-1)]});
}
function bedges(list){const set=new Set(list.map(c=>key(...c)));const out=[];
 list.forEach(([r,c])=>{const x=BX+c*S/2,y=BY+r*H,y1=y+H,up=isUp(r,c);
  const P=up?[[x,y1],[x+S,y1],[x+S/2,y]]:[[x,y],[x+S,y],[x+S/2,y1]];
  const nb=[up?[r+1,c]:[r-1,c],[r,c+1],[r,c-1]];
  for(let i=0;i<3;i++)if(!set.has(key(...nb[i])))out.push(`M${P[i][0]} ${P[i][1]}L${P[(i+1)%3][0]} ${P[(i+1)%3][1]}`)});
 return out.join('')}
function bbox(p){let a=1e9,b=1e9,c=-1e9,d=-1e9;p.cells.forEach(([r,cc])=>pts(r,cc).split(' ').forEach(s=>{const[x,y]=s.split(',').map(Number);a=Math.min(a,x);c=Math.max(c,x);b=Math.min(b,y);d=Math.max(d,y)}));return{x0:a,y0:b,w:c-a,h:d-b}}
const TS=.64;
function placeInSlot(p){const bb=bbox(p);p.sc=TS;p.ox=p.hx=p.sx-TS*(bb.x0+bb.w/2);p.oy=p.hy=p.sy-TS*(bb.y0+bb.h/2)}
function toTray(p){placeInSlot(p);draw(p);upd(p)}
function layout(){
 const W=400,gap=6,maxW=W-16,rows=[];let cur={it:[],w:0,h:0};
 pieces.forEach(p=>{const bb=bbox(p),d=1.02*Math.max(bb.w,bb.h)*TS;p.sd=d;
  if(cur.it.length&&cur.w+gap+d>maxW){rows.push(cur);cur={it:[],w:0,h:0}}
  cur.w+=(cur.it.length?gap:0)+d;cur.h=Math.max(cur.h,d);cur.it.push(p)});
 rows.push(cur);
 trayY=BY+4*H+22;let y=trayY+10;
 rows.forEach(rw=>{let x=(W-rw.w)/2;rw.it.forEach(p=>{p.sx=x+p.sd/2;p.sy=y+rw.h/2;x+=p.sd+gap;placeInSlot(p)});y+=rw.h+gap});
 trayH=y-gap+10-trayY;
 svg.setAttribute('viewBox',`0 0 400 ${trayY+trayH+8}`);
}
function setup(same){
 if(daily){const d=new Date();rnd=mb(d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate())}else rnd=Math.random;
 $('ov').style.display='none';cells=boardCells();occ=new Map();won=false;startT=null;penalty=0;moves=0;hints=0;stack=[];
 if(!same)regs=partition();
 const cf=CFG[diff];sel=null;
 pieces=regs.map((_,i)=>i).sort(()=>rnd()-.5).map((ri,i)=>{
  const p={sol:regs[ri].map(c=>[...c]),cells:regs[ri].map(c=>[...c]),color:COLORS[i],placed:false};
  if(cf.scr)for(let n=Math.floor(rnd()*6);n>0;n--)rot(p);
  return p});
 layout();
 msg.textContent=daily?"📅 Günün bulmacası · Dokun: döndür · Sürükle: yerleştir":"Dokun: döndür · Sürükle: yerleştir";
 const b=ls.get(bkey());$('b').textContent=b?fmt(b):'–';$('n').textContent=ls.get('solved')||0;
 render();stats();
}
function draw(p){p.g.innerHTML='';
 p.cells.forEach(([r,c])=>mk('polygon',{points:pts(r,c),fill:p.color,stroke:'rgba(255,255,255,.55)','stroke-width':1.5,'stroke-linejoin':'round'},p.g));
 mk('path',{d:bedges(p.cells),fill:'none',stroke:'rgba(40,30,80,.6)','stroke-width':2.5,'stroke-linecap':'round'},p.g);
 p.g.style.filter=(p===sel)?'drop-shadow(0 0 5px rgba(90,70,170,.75))':'none'}
function render(){
 svg.innerHTML='';
 mk('rect',{x:10,y:trayY,width:380,height:trayH,rx:20,fill:'rgba(255,255,255,.6)'},svg);
 cells.forEach(([r,c])=>mk('polygon',{points:pts(r,c),fill:'#fff',stroke:'#dcdff0','stroke-width':1.5,'stroke-linejoin':'round'},svg));
 mk('path',{d:bedges(cells),fill:'none',stroke:'#aeb3d6','stroke-width':3,'stroke-linecap':'round'},svg);
 pieces.forEach(p=>{p.g=mk('g',{class:'piece'},svg);draw(p);upd(p);p.g.addEventListener('pointerdown',e=>down(e,p))});
}
function select(p){const o=sel;sel=p;o&&o.g&&draw(o);p&&draw(p)}
svg.addEventListener('pointerdown',e=>{if(!e.target.closest('.piece'))select(null)});
function upd(p){p.g.setAttribute('transform',`translate(${p.ox},${p.oy}) scale(${p.sc})`)}
function pos(e){const q=svg.createSVGPoint();q.x=e.clientX;q.y=e.clientY;return q.matrixTransform(svg.getScreenCTM().inverse())}
function free(p){p.cells.forEach(([r,c])=>occ.delete(key(r+p.dr,c+p.dc)));p.placed=false;stack=stack.filter(x=>x!==p)}
function down(e,p){
 e.preventDefault();if(won)return;
 select(p);
 const s=pos(e);let o0=[p.ox,p.oy],ghost=null;let moved=false;
 svg.appendChild(p.g);
 try{p.g.setPointerCapture(e.pointerId)}catch(x){}
 const mv=ev=>{if(ev.pointerId!==e.pointerId)return;const q=pos(ev);if(!moved&&Math.hypot(q.x-s.x,q.y-s.y)>8){moved=true;if(startT===null)startT=Date.now();if(p.placed)free(p);if(p.sc<1){const lx=(s.x-o0[0])/p.sc,ly=(s.y-o0[1])/p.sc;p.sc=1;o0=[s.x-lx,s.y-ly-30]}ghost=mk('g',{'pointer-events':'none'});svg.insertBefore(ghost,p.g)}
  if(moved){p.ox=o0[0]+q.x-s.x;p.oy=o0[1]+q.y-s.y;upd(p);
   const b=find(p);ghost.innerHTML='';if(b)p.cells.forEach(([r,c])=>mk('polygon',{points:pts(r+b[0],c+b[1]),fill:p.color,'fill-opacity':.35,stroke:p.color,'stroke-width':2,'stroke-dasharray':'5 4'},ghost))}};
 let done=false;const up=ev=>{if(done||(ev&&ev.pointerId!==e.pointerId))return;done=true;window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);
  ghost&&ghost.remove();if(!moved){rotateP(p);return}
  moves++;if(!snap(p))toTray(p);stats()};
 window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
}
function rotateP(p){
 if(won)return;
 if(startT===null)startT=Date.now();
 const was=p.placed;if(was)free(p);
 rot(p);moves++;tone(380,.05);
 if(!(was&&snap(p)))toTray(p);stats();
}
function rotateSel(){if(!sel){msg.textContent="Önce bir parçaya dokun";return}rotateP(sel)}
function find(p){
 const fr=Math.round(p.oy/H),fc=Math.round(p.ox/(S/2));let best=null,bd=1e9;
 const inB=new Set(cells.map(x=>key(...x)));
 for(let dr=fr-2;dr<=fr+2;dr++)for(let dc=fc-2;dc<=fc+2;dc++){
  if(((dr+dc)%2+2)%2)continue;
  const d=Math.hypot(p.ox-dc*S/2,p.oy-dr*H);if(d>S*.9||d>=bd)continue;
  if(p.cells.every(([r,c])=>{const k=key(r+dr,c+dc);return inB.has(k)&&!occ.has(k)})){best=[dr,dc];bd=d}
 }
 return best}
function snap(p){const best=find(p);if(!best)return false;
 p.dr=best[0];p.dc=best[1];p.ox=p.dc*S/2;p.oy=p.dr*H;p.placed=true;stack.push(p);
 p.cells.forEach(([r,c])=>occ.set(key(r+p.dr,c+p.dc),1));upd(p);
 tone(560,.09);navigator.vibrate&&navigator.vibrate(15);
 if(occ.size===cells.length){select(null);win()}
 return true}
function el(){return startT===null?0:(Date.now()-startT)/1000+penalty}
function stats(){$('pg').style.width=(cells?occ.size/cells.length*100:0)+'%';$('t').textContent=fmt(el());$('m').textContent=moves}
function confetti(){
 const g=mk('g',{'pointer-events':'none'},svg);
 for(let i=0;i<50;i++){const r=mk('rect',{x:Math.random()*400,y:-20,width:8,height:12,fill:COLORS[i%8]},g);
  mk('animateTransform',{attributeName:'transform',type:'translate',from:'0 0',to:`${Math.random()*120-60} 720`,dur:(2+Math.random()*1.5)+'s',fill:'freeze'},r)}
 setTimeout(()=>g.remove(),4000);
}
function win(){
 won=true;const t=Math.floor(el()),goal=CFG[diff].goal;
 const st=hints===0&&t<=goal?3:t<=goal*2?2:1;
 let txt="🎉 "+'⭐'.repeat(st)+" "+fmt(t)+" · "+moves+" hamle";
 const k=bkey(),b=ls.get(k);
 if(!b||t<+b){ls.set(k,t);txt+=" · Yeni rekor!";$('b').textContent=fmt(t)}
 const n=(+ls.get('solved')||0)+1;ls.set('solved',n);$('n').textContent=n;
 msg.textContent=txt;confetti();const ts=(+ls.get('stars')||0)+st;ls.set('stars',ts);
 setTimeout(()=>{if(!won)return;$('ovs').textContent='⭐'.repeat(st)+'☆'.repeat(3-st);$('ovt').innerHTML='Süre <b>'+fmt(t)+'</b> · Hamle <b>'+moves+'</b><br>İpucu <b>'+hints+'</b> · Toplam ⭐ <b>'+ts+'</b>';$('ov').style.display='flex'},900);[523,659,784,1047].forEach((f,i)=>tone(f,.18,i*.14));
}
function hint(){
 if(won)return;const u=pieces.filter(p=>!p.placed);if(!u.length)return;
 if(startT===null)startT=Date.now();
 penalty+=10;hints++;const p=(sel&&!sel.placed)?sel:u[Math.floor(Math.random()*u.length)];
 hintG&&hintG.remove();hintG=mk('g',{'pointer-events':'none'},svg);
 p.sol.forEach(([r,c])=>mk('polygon',{points:pts(r,c),fill:p.color,'fill-opacity':.5,stroke:p.color,'stroke-width':3,'stroke-dasharray':'6 4'},hintG));
 const g=hintG;setTimeout(()=>g.remove(),2500);
 msg.textContent="İpucu (+10sn): bu parça aynı yönde şuraya gider";stats();
}
function undo(){if(won)return;const p=stack.pop();if(!p)return;free(p);toTray(p);tone(300,.06);stats()}
function pick(d,dl){daily=dl;if(d)diff=d;if(dl)diff='orta';[...$('seg').children].forEach(b=>b.classList.toggle('on',b.dataset.d===diff));setup(false)}
$('ro').onclick=rotateSel;$('ovc').onclick=()=>{$('ov').style.display='none'};$('ovn').onclick=()=>showAd(()=>pick(null,false));$('hb').onclick=hint;$('ub').onclick=undo;$('rb').onclick=()=>setup(true);
$('nb').onclick=()=>showAd(()=>pick(null,false));$('db').onclick=()=>pick('orta',true);
$('seg').onclick=e=>{const d=e.target.dataset.d;if(d)pick(d,false)};
$('sb').onclick=()=>{snd=!snd;$('sb').textContent=snd?'🔊':'🔇'};
let adT=null;
function showAd(cb){
 if(startT===null&&!won){cb();return}
 const box=$('adbox'),btn=$('adc');box.innerHTML='';
 const ins=document.createElement('ins');ins.className='adsbygoogle';ins.style.cssText='display:block;width:100%;min-height:250px';
 ins.setAttribute('data-ad-client','ca-pub-1880946354382681');ins.setAttribute('data-ad-slot','1435965312');ins.setAttribute('data-ad-format','auto');ins.setAttribute('data-full-width-responsive','true');
 box.appendChild(ins);
 $('ad').style.display='flex';$('ov').style.display='none';
 setTimeout(()=>{try{(window.adsbygoogle=window.adsbygoogle||[]).push({})}catch(e){}},120);
 setTimeout(()=>{if(!ins.getAttribute('data-ad-status')||ins.getAttribute('data-ad-status')==='unfilled'){if(!box.querySelector('.noad')){const d=document.createElement('div');d.className='noad';d.style.cssText='position:absolute';d.textContent='';box.appendChild(d);box.firstChild.style.display='none';box.insertAdjacentHTML('beforeend','<span style="padding:20px;text-align:center">Şu an gösterilecek reklam yok.<br>Kapat düğmesiyle devam edebilirsiniz.</span>')}}},4500);
 let n=5;btn.disabled=true;btn.classList.remove('on');btn.textContent='Kapat ('+n+')';clearInterval(adT);
 adT=setInterval(()=>{n--;if(n>0)btn.textContent='Kapat ('+n+')';else{clearInterval(adT);btn.disabled=false;btn.classList.add('on');btn.textContent='Kapat ✕'}},1000);
 btn.onclick=()=>{if(btn.disabled)return;$('ad').style.display='none';cb()};
}
let hid=0;document.addEventListener('visibilitychange',()=>{if(document.hidden)hid=Date.now();else if(hid&&startT!==null&&!won)startT+=Date.now()-hid;hid=0});
setInterval(()=>{if(!won&&startT!==null)stats()},500);
setup(false);
</script></body></html>
