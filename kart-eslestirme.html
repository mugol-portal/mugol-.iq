<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kart Eşleştirme</title>
<style>
:root{--bg:#eef3f1;--ink:#1d2b2a;--muted:#5d706d;--back:#1f6f6b;--back2:#2a8a85;--face:#fff;--ok:#e2f3e6;--okb:#3a9b5c;--btn:#1d2b2a;--btnink:#fff;--gold:#d99a00;--line:#c5d3d0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a19;--ink:#e8f2f0;--muted:#92a9a5;--back:#2a8a85;--back2:#37a59f;--face:#1b2b2a;--ok:#1d3a28;--okb:#4cc17a;--btn:#e8f2f0;--btnink:#101a19;--gold:#f0b429;--line:#2d4442}}
:root[data-theme="dark"]{--bg:#101a19;--ink:#e8f2f0;--muted:#92a9a5;--back:#2a8a85;--back2:#37a59f;--face:#1b2b2a;--ok:#1d3a28;--okb:#4cc17a;--btn:#e8f2f0;--btnink:#101a19;--gold:#f0b429;--line:#2d4442}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center}
main{width:100%;max-width:480px;padding:20px 16px 28px}
h1{font-size:28px;margin:0 0 6px}h2{font-size:22px;margin:0 0 12px}
p{margin:0 0 12px;color:var(--muted)}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,.card:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.screen{display:none}.screen.on{display:block}
.btn{display:block;width:100%;padding:14px;border-radius:12px;border:0;background:var(--btn);color:var(--btnink);font-size:17px;margin-bottom:10px}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.btn.sm{padding:9px 14px;font-size:14px;width:auto;display:inline-block;margin:0 6px 0 0}
.hero{text-align:center;padding:36px 0 22px}
.hero .big{font-size:64px;line-height:1}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.coin{font-weight:bold;color:var(--gold)}
.lvgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.lvb{aspect-ratio:1;border-radius:14px;border:2px solid var(--ink);background:var(--face);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:19px;font-weight:bold}
.lvb small{font-size:12px;color:var(--gold);letter-spacing:1px}
.lvb:disabled{opacity:.4;cursor:not-allowed;border-style:dashed}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);gap:10px}
.row:last-child{border:0}
.seg{display:flex;gap:6px}
.seg button{border:2px solid var(--ink);background:transparent;padding:6px 10px;border-radius:10px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--btnink)}
.stat{font-size:14px;color:var(--muted)}.stat b{color:var(--ink);font-size:17px}
.grid{display:grid;gap:8px;grid-template-columns:repeat(var(--c),1fr)}
.card{aspect-ratio:1;perspective:600px;border:0;background:none;padding:0}
.in{position:relative;width:100%;height:100%;transition:transform .4s;transform-style:preserve-3d}
.card.open .in,.card.done .in{transform:rotateY(180deg)}
.f,.b{position:absolute;inset:0;border-radius:12px;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.b{background:repeating-linear-gradient(45deg,var(--back),var(--back) 8px,var(--back2) 8px,var(--back2) 16px);border:3px solid var(--face)}
.f{background:var(--face);border:3px solid var(--back);transform:rotateY(180deg);font-size:calc((min(100vw,480px) - 32px) / var(--c) * .6);line-height:1}
.card.done .f{background:var(--ok);border-color:var(--okb)}
.card.shake .in{animation:sh .35s}
@keyframes sh{0%,100%{transform:rotateY(180deg)}25%{transform:rotateY(180deg) translateX(-5px)}75%{transform:rotateY(180deg) translateX(5px)}}
.panel{margin-top:14px;padding:16px;border-radius:14px;background:var(--ok);border:2px solid var(--okb);text-align:center;display:none}
.panel.show{display:block}.stars{font-size:34px;color:var(--gold)}
.item{display:flex;align-items:center;gap:12px;padding:12px;border:2px solid var(--line);border-radius:12px;margin-bottom:10px;background:var(--face)}
.item.on{border-color:var(--okb)}.item .e{font-size:26px;min-width:34px;text-align:center}.item .t{flex:1}.item .t b{display:block}.item .t span{font-size:13px;color:var(--muted)}
.item.lock{opacity:.5}
.msg{font-size:14px;margin-top:8px;min-height:20px}
@media (prefers-reduced-motion:reduce){.in{transition:none}.card.shake .in{animation:none}}
</style>
</head>
<body>
<main>

<section class="screen on" id="s-home">
  <div class="hero"><div class="big">🃏</div><h1>Hoş geldiniz!</h1><p>Aynı kartları bul, yıldız ve altın kazan.</p></div>
  <button class="btn" id="go">Başla</button>
  <button class="btn alt" id="daily" style="display:none">🎁 Günlük ödül: +10 altın</button>
  <button class="btn alt" data-go="rewards">Ödüller</button>
  <button class="btn alt" data-go="settings">Ayarlar</button>
</section>

<section class="screen" id="s-levels">
  <div class="top"><button class="btn alt sm" data-go="home">‹ Menü</button><span class="coin">🪙 <span class="coins"></span></span></div>
  <h2>Seviyeler</h2>
  <div class="lvgrid" id="lvgrid"></div>
</section>

<section class="screen" id="s-game">
  <div class="top"><button class="btn alt sm" data-go="levels">‹ Seviyeler</button><b id="gtitle"></b></div>
  <div class="top"><div class="stat">Hamle <b id="moves">0</b> · Süre <b id="time">0</b> sn</div><span class="coin">🪙 <span class="coins"></span></span></div>
  <div class="top"><button class="btn alt sm" id="hint">💡 İpucu · 3 altın</button><span class="stat" id="combo" aria-live="polite"></span></div>
  <div class="grid" id="grid"></div>
  <div class="panel" id="win" role="status">
    <div class="stars" id="wstars"></div><p id="wtxt" style="color:var(--ink)"></p>
    <button class="btn" id="next">Sonraki seviye</button>
    <button class="btn alt" id="again">Tekrar oyna</button>
  </div>
</section>

<section class="screen" id="s-rewards">
  <div class="top"><button class="btn alt sm" data-go="home">‹ Menü</button><span class="coin">🪙 <span class="coins"></span></span></div>
  <h2>Kart temaları</h2><div id="themes"></div>
  <h2 style="margin-top:20px">Rozetler</h2><div id="badges"></div>
</section>

<section class="screen" id="s-settings">
  <div class="top"><button class="btn alt sm" data-go="home">‹ Menü</button></div>
  <h2>Ayarlar</h2>
  <div class="row"><span>Ses</span><div class="seg" id="snd"><button data-v="1">Açık</button><button data-v="0">Kapalı</button></div></div>
  <div class="row"><span>Başta kartları göster</span><div class="seg" id="prev"><button data-v="1">Açık</button><button data-v="0">Kapalı</button></div></div>
  <div class="row"><span>Görünüm</span><div class="seg" id="look"><button data-v="auto">Otomatik</button><button data-v="light">Açık</button><button data-v="dark">Koyu</button></div></div>
  <h2 style="margin-top:20px">Yedek</h2>
  <p>İlerlemeni (seviyeler, altın, rozetler, temalar) dosyaya kaydet, istediğin zaman geri yükle.</p>
  <button class="btn" id="exp">Yedeği indir</button>
  <button class="btn alt" id="imp">Yedeği yükle</button>
  <input type="file" id="file" accept=".js,.txt,.json" hidden>
  <div class="msg" id="bmsg" role="status"></div>
  <button class="btn alt" id="reset" style="margin-top:14px">İlerlemeyi sıfırla</button>
</section>

</main>
<script>
const PR=[3,4,5,6,8,10,12,15],COLS={3:3,4:4,5:5,6:4,8:4,10:5,12:6,15:6};
const LV=Array.from({length:100},(_,i)=>PR[Math.min(7,Math.floor(i/13))]);
const TH={
animals:{n:"Hayvanlar",p:0,e:"🐶 🐱 🦊 🐼 🐸 🦁 🐵 🐰 🐙 🦄 🐯 🐮 🐷 🐨 🐔 🐧 🦉 🐢 🦋 🐝"},
fruits:{n:"Meyveler",p:15,e:"🍎 🍌 🍇 🍓 🍉 🍒 🍑 🍍 🥝 🍋 🥥 🍐 🍊 🥭 🫐 🍈 🥑 🍅 🌽 🥕"},
food:{n:"Yiyecekler",p:25,e:"🍕 🍔 🍟 🌭 🍿 🥐 🍞 🧀 🍳 🥞 🍩 🍪 🎂 🍫 🍦 🍣 🌮 🥪 🍜 🍰"},
space:{n:"Uzay",p:30,e:"🌙 ⭐ 🪐 🚀 ☄️ 👽 🌍 ☀️ 🛸 🔭 🌟 🌠 🌌 🌑 🌕 🛰️ 🌎 🌈 ⚡ 🔥"},
sea:{n:"Deniz",p:40,e:"🐠 🐳 🦀 🐚 🦈 🐢 🦑 🐡 🐬 🦞 🌊 🦭 🐋 🦐 ⚓ 🏝️ 🐟 🏄 🚤 🧜"},
sports:{n:"Spor",p:50,e:"⚽ 🏀 🏈 ⚾ 🎾 🏐 🏉 🎱 🏓 🏸 🥊 ⛳ 🏹 🎯 🏆 🥇 🛹 🚴 🏊 ⛸️"},
vehicles:{n:"Taşıtlar",p:60,e:"🚗 🚕 🚌 🚓 🚑 🚒 🚜 🚲 🛵 🏍️ 🚂 ✈️ 🚁 🚡 🚢 ⛵ 🚤 🛶 🚃 🛴"},
nature:{n:"Doğa",p:75,e:"🌹 🌻 🌷 🌸 🌼 🍀 🌵 🌴 🌲 🍁 🍄 🌿 🌺 🌳 🍂 🌾 💐 🌱 🏔️ 🌋"}};
const BADGES={first:["🎯","İlk adım","İlk seviyeyi bitir"],star3:["⭐","Üç yıldız","Bir seviyeyi 3 yıldızla bitir"],half:["🏁","Yarı yol","50. seviyeyi bitir"],fast:["⚡","Şimşek","Bir seviyeyi 20 saniyeden kısa sürede bitir"],shop:["🛍️","Koleksiyoncu","Bir tema satın al"],all:["🏆","Şampiyon","Tüm seviyeleri bitir"]};
const fresh=()=>({v:1,levels:{},coins:0,themes:["animals"],theme:"animals",badges:[],sound:1,look:"auto",daily:"",preview:0});
let S=fresh();
try{const r=localStorage.getItem("kart-save");if(r)S=sane(JSON.parse(r))}catch(e){}
function sane(o){const s=fresh();if(!o||typeof o!=="object")return s;
 const n=(x,m)=>Math.max(0,Math.min(m,Math.floor(+x)||0));
 if(o.levels&&typeof o.levels==="object")for(let i=1;i<=LV.length;i++){const l=o.levels[i];if(l)s.levels[i]={stars:n(l.stars,3),best:n(l.best,9999)}}
 s.coins=n(o.coins,1e6);
 if(Array.isArray(o.themes))s.themes=["animals",...o.themes.filter(t=>TH[t]&&t!=="animals")];
 s.theme=s.themes.includes(o.theme)?o.theme:"animals";
 if(Array.isArray(o.badges))s.badges=o.badges.filter(b=>BADGES[b]);
 s.sound=o.sound===0?0:1;s.daily=typeof o.daily==="string"?o.daily.slice(0,30):"";s.preview=o.preview===1?1:0;s.look=["auto","light","dark"].includes(o.look)?o.look:"auto";return s}
const save=()=>{try{localStorage.setItem("kart-save",JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id),$$=q=>document.querySelectorAll(q);
function show(n){$$(".screen").forEach(s=>s.classList.toggle("on",s.id==="s-"+n));$$(".coins").forEach(c=>c.textContent=S.coins);
 if(n==="home")dailyUpd();if(n==="levels")drawLevels();if(n==="rewards")drawRewards();if(n==="settings")drawSettings();window.scrollTo(0,0)}
$$("[data-go]").forEach(b=>b.onclick=()=>{if(b.dataset.go!=="game")stopTimer();show(b.dataset.go)});
$("go").onclick=()=>show("levels");
function beep(f,d){if(!S.sound)return;try{const a=beep.c||(beep.c=new(window.AudioContext||window.webkitAudioContext)),o=a.createOscillator(),g=a.createGain();o.frequency.value=f;g.gain.value=.08;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d)}catch(e){}}
function look(){const r=document.documentElement;S.look==="auto"?r.removeAttribute("data-theme"):r.setAttribute("data-theme",S.look)}
function drawLevels(){const g=$("lvgrid");g.innerHTML="";LV.forEach((p,i)=>{const n=i+1,d=S.levels[n],ok=n===1||S.levels[n-1];
 const b=document.createElement("button");b.className="lvb";b.disabled=!ok;
 b.innerHTML=(ok?n:"🔒")+"<small>"+(d?"★".repeat(d.stars)+"☆".repeat(3-d.stars):"&nbsp;")+"</small>";
 b.setAttribute("aria-label","Seviye "+n+(ok?"":" kilitli"));b.onclick=()=>play(n);g.appendChild(b)});const cur=[...g.children].find(x=>!x.disabled&&!x.querySelector("small").textContent.includes("★"));if(cur)setTimeout(()=>cur.scrollIntoView({block:"center"}),0)}
function drawRewards(){const t=$("themes");t.innerHTML="";Object.keys(TH).forEach(k=>{const h=TH[k],own=S.themes.includes(k),d=document.createElement("div");
 d.className="item"+(S.theme===k?" on":"");
 d.innerHTML='<div class="e">'+h.e.split(" ").slice(0,2).join("")+'</div><div class="t"><b>'+h.n+'</b><span>'+(own?(S.theme===k?"Kullanılıyor":"Sahipsin"):h.p+" altın")+'</span></div>';
 const b=document.createElement("button");b.className="btn alt sm";b.style.margin=0;
 b.textContent=own?(S.theme===k?"Seçili":"Seç"):"Satın al";b.disabled=S.theme===k||(!own&&S.coins<h.p);
 b.onclick=()=>{if(!own){S.coins-=h.p;S.themes.push(k);grant("shop")}S.theme=k;save();show("rewards")};
 d.appendChild(b);t.appendChild(d)});
 const bd=$("badges");bd.innerHTML="";Object.keys(BADGES).forEach(k=>{const o=S.badges.includes(k),b=BADGES[k],d=document.createElement("div");
 d.className="item"+(o?" on":" lock");d.innerHTML='<div class="e">'+(o?b[0]:"🔒")+'</div><div class="t"><b>'+b[1]+'</b><span>'+b[2]+'</span></div>';bd.appendChild(d)})}
function grant(k){if(!S.badges.includes(k)){S.badges.push(k);return true}return false}
function drawSettings(){$$("#snd button").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.v===S.sound));
 $$("#look button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===S.look));$$("#prev button").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.v===S.preview));$("bmsg").textContent=""}
$$("#snd button").forEach(b=>b.onclick=()=>{S.sound=+b.dataset.v;save();drawSettings()});
$$("#look button").forEach(b=>b.onclick=()=>{S.look=b.dataset.v;save();look();drawSettings()});
$$("#prev button").forEach(b=>b.onclick=()=>{S.preview=+b.dataset.v;save();drawSettings()});
$("reset").onclick=()=>{if(confirm("Tüm ilerleme silinsin mi?")){S=fresh();save();look();drawSettings();$("bmsg").textContent="İlerleme sıfırlandı."}};

/* Yedek: kart-eslestirme-yedegi dosyası */
$("exp").onclick=async()=>{const m=$("bmsg");let d=null;try{d=await claude.use("downloads")}catch(e){}
 if(!d){m.textContent="Bu görünümde indirme kullanılamıyor.";return}
 const text="// Kart Eşleştirme yedeği\nwindow.KART_YEDEK = "+JSON.stringify(S,null,1)+";\n";
 try{await d.save({filename:"kart-eslestirme-yedegi.txt",data:text});m.textContent="Yedek kaydedildi."}
 catch(e){m.textContent=e&&e.code==="declined"?"İndirme iptal edildi.":"Yedek kaydedilemedi."}};
$("imp").onclick=()=>$("file").click();
$("file").onchange=e=>{const f=e.target.files[0],m=$("bmsg");if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const t=String(r.result),a=t.indexOf("{"),b=t.lastIndexOf("}");if(a<0||b<a)throw 0;
  S=sane(JSON.parse(t.slice(a,b+1)));save();look();drawSettings();$("bmsg").textContent="Yedek yüklendi. "+Object.keys(S.levels).length+" seviye, "+S.coins+" altın."}
  catch(x){m.textContent="Bu dosya geçerli bir yedek değil."}};
 r.onerror=()=>{m.textContent="Dosya okunamadı."};r.readAsText(f);e.target.value=""};

/* Oyun */
let streak=0,bonus=0,pvT=0,lvl=1,first=null,lock=false,moves=0,matched=0,sec=0,timer=null,pairs=3;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function stopTimer(){clearInterval(timer);timer=null}
function play(n){lvl=n;pairs=LV[n-1];stopTimer();clearTimeout(pvT);first=null;lock=false;moves=0;matched=0;sec=0;streak=0;bonus=0;$("combo").textContent="";
 $("moves").textContent=0;$("time").textContent=0;$("win").className="panel";$("gtitle").textContent="Seviye "+n;
 const g=$("grid");g.style.setProperty("--c",COLS[pairs]);g.innerHTML="";
 const em=shuffle(TH[S.theme].e.split(" ")).slice(0,pairs);
 shuffle(em.concat(em)).forEach(e=>{const c=document.createElement("button");c.className="card";c.dataset.e=e;c.setAttribute("aria-label","Kapalı kart");
  c.innerHTML='<div class="in"><div class="b"></div><div class="f">'+e+'</div></div>';c.onclick=()=>flip(c);g.appendChild(c)});
 if(S.preview){lock=true;$$("#grid .card").forEach(c=>c.classList.add("open"));pvT=setTimeout(()=>{$$("#grid .card").forEach(c=>c.classList.remove("open"));lock=false},1500+pairs*150)}
 show("game")}
function flip(c){if(lock||c.classList.contains("open")||c.classList.contains("done"))return;
 if(!timer)timer=setInterval(()=>{sec++;$("time").textContent=sec},1000);
 c.classList.add("open");c.setAttribute("aria-label","Kart "+c.dataset.e);beep(440,.08);
 if(!first){first=c;return}
 moves++;$("moves").textContent=moves;const a=first;first=null;
 if(a.dataset.e===c.dataset.e){a.classList.add("done");c.classList.add("done");matched++;streak++;if(streak>=2){bonus++;$("combo").textContent="🔥 Seri x"+streak}setTimeout(()=>beep(660,.15),200);if(matched===pairs)finish()}
 else{streak=0;$("combo").textContent="";try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}lock=true;setTimeout(()=>{a.classList.add("shake");c.classList.add("shake")},350);
  setTimeout(()=>{[a,c].forEach(x=>{x.classList.remove("open","shake");x.setAttribute("aria-label","Kapalı kart")});lock=false},900)}}
function finish(){stopTimer();
 const w=(lvl-1)%13,stars=moves<=Math.ceil(pairs*(1.7-w*.03))?3:moves<=Math.ceil(pairs*(2.4-w*.03))?2:1;
 const old=S.levels[lvl],os=old?old.stars:0;
 let coins=old?Math.max(0,stars-os)*5+1:stars*5+5;
 S.levels[lvl]={stars:Math.max(stars,os),best:old?Math.min(old.best||9999,moves):moves};S.coins+=coins;
 const nb=[];const add=k=>{if(grant(k))nb.push(BADGES[k][0]+" "+BADGES[k][1])};
 add("first");if(stars===3)add("star3");if(lvl>=50)add("half");if(sec<20)add("fast");
 if(LV.every((_,i)=>S.levels[i+1]))add("all");
 save();$$(".coins").forEach(c=>c.textContent=S.coins);
 $("wstars").textContent="★".repeat(stars)+"☆".repeat(3-stars);
 $("wtxt").textContent=moves+" hamle, "+sec+" saniye. +"+coins+" altın"+(bonus?" (seri bonusu dahil)":"")+"."+(nb.length?" Yeni rozet: "+nb.join(", ")+".":"");
 $("next").style.display=lvl<LV.length?"block":"none";$("win").className="panel show";beep(880,.3)}
function dailyUpd(){$("daily").style.display=S.daily===new Date().toDateString()?"none":"block"}
$("daily").onclick=()=>{S.daily=new Date().toDateString();S.coins+=10;save();dailyUpd()};
$("hint").onclick=()=>{if(lock||matched===pairs)return;
 if(S.coins<3){$("combo").textContent="Altın yetmiyor";return}
 const cs=[...$$("#grid .card")].filter(c=>!c.classList.contains("done"));
 const pair=first?cs.filter(c=>c!==first&&c.dataset.e===first.dataset.e):(e=>cs.filter(c=>c.dataset.e===e))(cs[Math.floor(Math.random()*cs.length)].dataset.e);
 S.coins-=3;save();$$(".coins").forEach(x=>x.textContent=S.coins);
 lock=true;pair.forEach(c=>c.classList.add("open"));
 setTimeout(()=>{pair.forEach(c=>c.classList.remove("open"));lock=false},1100)};
$("next").onclick=()=>play(lvl+1);$("again").onclick=()=>play(lvl);
look();dailyUpd();
</script>
</body>
</html>
