<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Striker Ultimate</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-green:  #39ff14;
            --neon-red:    #ff073a;
            --neon-blue:   #00e5ff;
            --neon-yellow: #fff01f;
            --neon-pink:   #ff2d78;
            --ground-color:#0d0d0d;
            --bg:          #050810;
            --panel:       rgba(0,10,30,0.85);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0; padding: 0;
            background: var(--bg);
            color: #fff;
            font-family: 'Share Tech Mono', monospace;
            overflow: hidden;
            touch-action: none;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Animated grid background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0,229,255,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,229,255,0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 500px;
            background: var(--bg);
            border-left:  1px solid rgba(0,229,255,0.2);
            border-right: 1px solid rgba(0,229,255,0.2);
            box-shadow:
                0 0 60px rgba(0,229,255,0.08),
                inset 0 0 40px rgba(0,0,0,0.5);
        }

        canvas { display: block; }

        /* ─── HEADER ──────────────────────────────── */
        .header {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 64px;
            background: var(--panel);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
            border-bottom: 1px solid rgba(0,229,255,0.25);
            z-index: 10;
            gap: 4px;
        }

        .header-stat {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            flex: 1;
        }
        .header-stat .label {
            font-family: 'Orbitron', monospace;
            font-size: 8px;
            letter-spacing: 2px;
            color: rgba(0,229,255,0.5);
            text-transform: uppercase;
        }
        .header-stat .value {
            font-family: 'Orbitron', monospace;
            font-size: 18px;
            font-weight: 700;
            color: var(--neon-blue);
            text-shadow: 0 0 10px var(--neon-blue);
        }

        /* ─── HEADER ICON BUTTONS ────────────────── */
        .header-icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: rgba(0,229,255,0.07);
            border: 1px solid rgba(0,229,255,0.35);
            color: var(--neon-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s, box-shadow 0.2s;
            flex-shrink: 0;
        }
        .header-icon-btn:hover, .header-icon-btn:active {
            background: rgba(0,229,255,0.18);
            box-shadow: 0 0 14px rgba(0,229,255,0.4);
        }
        .header-icon-btn svg {
            width: 16px; height: 16px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        #upload-input { display: none; }

        /* ─── BACK BUTTON ─────────────────────────── */
        #back-btn {
            position: absolute;
            top: 12px;
            left: 12px;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: linear-gradient(160deg, rgba(0,229,255,0.14), rgba(0,229,255,0.04));
            border: 1px solid rgba(0,229,255,0.45);
            color: var(--neon-blue);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 300;
            transition: background 0.2s, box-shadow 0.2s, transform 0.15s;
            line-height: 1;
            box-shadow: 0 0 12px rgba(0,229,255,0.25), inset 0 0 8px rgba(0,229,255,0.08);
        }
        #back-btn:hover {
            background: linear-gradient(160deg, rgba(0,229,255,0.26), rgba(0,229,255,0.08));
            box-shadow: 0 0 20px rgba(0,229,255,0.55), inset 0 0 10px rgba(0,229,255,0.15);
        }
        #back-btn:active {
            transform: scale(0.92);
        }
        #back-btn svg {
            width: 18px; height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 4px rgba(0,229,255,0.7));
        }

        /* ─── BOTTOM BAR ──────────────────────────── */
        .bottom-bar {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%;
            height: 54px;
            background: var(--panel);
            border-top: 1px solid rgba(0,229,255,0.25);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
        }
        .bottom-bar span {
            font-family: 'Orbitron', monospace;
            font-size: 9px;
            letter-spacing: 3px;
            color: rgba(0,229,255,0.35);
        }

        /* ─── SPEED BUTTON ────────────────────────── */
        #speed-btn {
            position: absolute;
            bottom: 64px;
            right: 16px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255,240,31,0.08);
            border: 1.5px solid var(--neon-yellow);
            color: var(--neon-yellow);
            font-family: 'Orbitron', monospace;
            font-size: 11px;
            font-weight: 700;
            display: none;
            z-index: 10;
            cursor: pointer;
            text-shadow: 0 0 8px var(--neon-yellow);
            box-shadow: 0 0 12px rgba(255,240,31,0.2);
            transition: box-shadow 0.2s;
        }
        #speed-btn:hover { box-shadow: 0 0 22px rgba(255,240,31,0.5); }

        /* ─── BALL INFO ───────────────────────────── */
        .ball-info {
            position: absolute;
            bottom: 62px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            color: rgba(255,255,255,0.4);
            letter-spacing: 1px;
            white-space: nowrap;
            pointer-events: none;
        }

        /* ─── OVERLAY ─────────────────────────────── */
        .overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(5,8,16,0.93);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            gap: 20px;
        }

        .overlay-logo {
            font-family: 'Orbitron', monospace;
            font-size: 13px;
            letter-spacing: 6px;
            color: rgba(0,229,255,0.45);
            margin-bottom: -10px;
        }
        .overlay-title {
            font-family: 'Orbitron', monospace;
            font-weight: 900;
            font-size: clamp(28px, 9vw, 42px);
            letter-spacing: 4px;
            color: var(--neon-blue);
            text-shadow:
                0 0 20px var(--neon-blue),
                0 0 60px rgba(0,229,255,0.3);
            margin: 0;
        }
        .overlay-subtitle {
            font-size: 12px;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.35);
            margin-top: -12px;
        }

        /* Stats box on game over */
        .stats-box {
            background: rgba(0,229,255,0.05);
            border: 1px solid rgba(0,229,255,0.2);
            border-radius: 8px;
            padding: 16px 32px;
            text-align: center;
            width: 220px;
        }
        .stats-box .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            gap: 20px;
        }
        .stats-box .stat-row:last-child { border-bottom: none; }
        .stats-box .stat-label {
            font-size: 10px;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.4);
        }
        .stats-box .stat-val {
            font-family: 'Orbitron', monospace;
            font-size: 16px;
            font-weight: 700;
            color: var(--neon-green);
            text-shadow: 0 0 8px var(--neon-green);
        }

        /* Game over title */
        .gameover-title {
            font-family: 'Orbitron', monospace;
            font-weight: 900;
            font-size: clamp(26px, 8vw, 38px);
            letter-spacing: 3px;
            color: var(--neon-red);
            text-shadow:
                0 0 20px var(--neon-red),
                0 0 50px rgba(255,7,58,0.3);
            margin: 0;
            animation: flicker 1.5s infinite;
        }
        @keyframes flicker {
            0%,100% { opacity: 1; }
            92% { opacity: 1; }
            93% { opacity: 0.7; }
            94% { opacity: 1; }
            96% { opacity: 0.5; }
            97% { opacity: 1; }
        }

        /* Buttons */
        .btn {
            font-family: 'Orbitron', monospace;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 3px;
            background: transparent;
            color: var(--neon-green);
            border: 1.5px solid var(--neon-green);
            padding: 14px 36px;
            cursor: pointer;
            box-shadow: 0 0 18px rgba(57,255,20,0.25), inset 0 0 0 0 rgba(57,255,20,0);
            transition: box-shadow 0.2s, background 0.2s;
            clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
        }
        .btn:hover {
            background: rgba(57,255,20,0.08);
            box-shadow: 0 0 30px rgba(57,255,20,0.45);
        }
        .btn.secondary {
            color: var(--neon-blue);
            border-color: var(--neon-blue);
            box-shadow: 0 0 14px rgba(0,229,255,0.2);
            font-size: 11px;
            padding: 11px 28px;
        }
        .btn.secondary:hover {
            background: rgba(0,229,255,0.08);
            box-shadow: 0 0 24px rgba(0,229,255,0.4);
        }

        /* Scanline effect */
        #game-container::after {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0,0,0,0.04) 2px,
                rgba(0,0,0,0.04) 4px
            );
            pointer-events: none;
            z-index: 200;
        }

        /* ── AdSense Reklam Kutusu (Overlay içi) ── */
        .mg-ad-box {
            position: relative;
            width: 300px;
            background: rgba(5, 8, 16, 0.7);
            border: 1px solid rgba(255, 7, 58, 0.15);
            border-radius: 12px;
            padding: 24px 10px 10px;
            overflow: visible;
            box-sizing: border-box;
            min-height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .mg-ad-box ins.adsbygoogle {
            display: block !important;
            width: 300px !important;
            height: 250px !important;
        }
        .mg-ad-label {
            position: absolute;
            top: 7px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.58rem;
            font-weight: 700;
            color: rgba(255, 7, 58, 0.3);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            background: rgba(5, 8, 16, 0.95);
            padding: 2px 10px;
            border-radius: 20px;
            border: 1px solid rgba(255, 7, 58, 0.15);
            white-space: nowrap;
            pointer-events: none;
            z-index: 1;
            font-family: 'Orbitron', monospace;
        }

        /* ── v2 eklemeler ── */
        .overlay { justify-content: flex-start; overflow-y: auto; padding: 16px 0; gap: 14px; }
        .overlay > * { flex-shrink: 0; }
        .overlay > :first-child { margin-top: auto; }
        .overlay > :last-child { margin-bottom: auto; }
        .overlay-title { animation: glow 2.5s ease-in-out infinite alternate; }
        @keyframes glow { to { text-shadow: 0 0 30px var(--neon-blue), 0 0 90px rgba(0,229,255,0.5); } }
        .best-line { font-family: 'Orbitron', monospace; font-size: 11px; letter-spacing: 3px; color: rgba(255,255,255,0.45); }
        .best-line b, .bottom-bar b { color: var(--neon-yellow); text-shadow: 0 0 8px var(--neon-yellow); }
        .legend { display: flex; gap: 10px; font-size: 12px; }
        .legend span { border: 1px solid currentColor; border-radius: 20px; padding: 4px 10px; background: rgba(255,255,255,0.03); }
        .bottom-bar { justify-content: space-between; padding: 0 14px; }
        .bar-btn { width: 38px; height: 34px; border-radius: 8px; background: rgba(0,229,255,0.07); border: 1px solid rgba(0,229,255,0.35); color: var(--neon-blue); font-size: 14px; cursor: pointer; }
        .bar-btn:active { background: rgba(0,229,255,0.22); }
        
        @keyframes pop { 40% { transform: scale(1.35); color: #fff; } }
        .record-badge { font-family: 'Orbitron', monospace; font-size: 12px; letter-spacing: 3px; color: var(--neon-yellow); text-shadow: 0 0 12px var(--neon-yellow); animation: flicker 1.5s infinite; }
        .ball-info { bottom: 92px; font-family: 'Orbitron', monospace; font-size: 12px; letter-spacing: 2px; }
    </style>
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1880946354382681" crossorigin="anonymous"></script>
</head>
<body>

<div id="game-container">

    <!-- Çıkış Tuşu (Oyun Ekranı) -->
    <button id="back-btn" title="Çıkış" onclick="goBack()" style="display:none;">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    </button>

    <div class="header">
        <!-- Sol boşluk (back btn için) -->
        <div style="width:44px; flex-shrink:0;"></div>

        <div class="header-stat">
            <div class="label">SKOR</div>
            <div class="value" id="score">0</div>
        </div>
        <div class="header-stat">
            <div class="label">TOP</div>
            <div class="value" id="ballQty">1</div>
        </div>
        <div class="header-stat">
            <div class="label">TUR</div>
            <div class="value" id="round">1</div>
        </div>

        <!-- İndir & Yükle -->
        <div style="display:flex; gap:6px; flex-shrink:0;">
            <button class="header-icon-btn" title="Skoru İndir" onclick="saveScore()">
                <svg viewBox="0 0 24 24"><path d="M12 3v13M7 11l5 5 5-5"/><path d="M5 21h14"/></svg>
            </button>
            <button class="header-icon-btn" title="Kayıt Yükle" onclick="document.getElementById('upload-input').click()">
                <svg viewBox="0 0 24 24"><path d="M12 21V8M7 13l5-5 5 5"/><path d="M5 3h14"/></svg>
            </button>
            <input type="file" id="upload-input" accept=".json" onchange="loadScore(event)">
        </div>
    </div>

    <button id="speed-btn" onclick="toggleSpeed()">2x</button>
    <div class="ball-info" id="ballInfo">Nişan al ve fırlat!</div>

    <canvas id="gameCanvas"></canvas>

    <div class="bottom-bar">
        <button class="bar-btn" id="mute-btn" title="Ses" onclick="toggleMute()">🔊</button>
        <span>REKOR <b class="best-val">0</b></span>
        <button class="bar-btn" title="Duraklat (P)" onclick="togglePause()">❚❚</button>
    </div>

    <!-- Başlangıç Ekranı -->
    <div id="startScreen" class="overlay">
        <div class="overlay-logo">// ARCADE //</div>
        <h1 class="overlay-title">NEON STRIKER</h1>
        <p class="overlay-subtitle">ULTIMATE EDITION</p>
        <div class="best-line">REKOR <b class="best-val">0</b></div>
        <div class="legend"><span style="color:#39ff14">+ TOP</span></div>
        <button class="btn" onclick="startGame()">BAŞLAT</button>
        <button class="btn secondary" onclick="exitToPortal()">ÇIKIŞ</button>

        <!-- ── ADSENSE REKLAM 1 — Başlangıç Ekranı ── -->
        <div class="mg-ad-box" aria-label="Reklam" role="complementary">
            <span class="mg-ad-label">Reklam</span>
            <ins class="adsbygoogle"
                 style="display:block;width:300px;height:250px;"
                 data-ad-client="ca-pub-1880946354382681"
                 data-ad-slot="1689789138"
                 data-ad-format="rectangle"></ins>
        </div>
    </div>

    <!-- Duraklatma Ekranı -->
    <div id="pauseScreen" class="overlay" style="display:none;">
        <h1 class="overlay-title" style="font-size:clamp(22px,7vw,32px)">DURAKLATILDI</h1>
        <button class="btn" onclick="togglePause()">DEVAM</button>
        <button class="btn secondary" onclick="goBack()">ANA MENÜ</button>
    </div>

    <!-- Oyun Bitti Ekranı -->
    <div id="gameOverScreen" class="overlay" style="display:none;">
        <h1 class="gameover-title">OYUN BİTTİ</h1>
        <div class="record-badge" id="recordBadge" style="display:none">★ YENİ REKOR ★</div>
        <div class="stats-box">
            <div class="stat-row">
                <span class="stat-label">SKOR</span>
                <span class="stat-val" id="finalScore">0</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">TUR</span>
                <span class="stat-val" id="finalRound">0</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">TOPLAR</span>
                <span class="stat-val" id="finalBalls">0</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">REKOR</span>
                <span class="stat-val" id="finalBest">0</span>
            </div>
        </div>
        <button class="btn" onclick="startGame()">TEKRAR DENE</button>
        <button class="btn secondary" onclick="saveScore()">💾 SKORU İNDİR</button>

        <!-- ── ADSENSE REKLAM 2 — Oyun Sonu Ekranı ── -->
        <div class="mg-ad-box" aria-label="Reklam" role="complementary">
            <span class="mg-ad-label">Reklam</span>
            <ins class="adsbygoogle"
                 style="display:block;width:300px;height:250px;"
                 data-ad-client="ca-pub-1880946354382681"
                 data-ad-slot="1689789138"
                 data-ad-format="rectangle"></ins>
        </div>
    </div>

</div>

<script>
    const canvas  = document.getElementById("gameCanvas");
    const ctx     = canvas.getContext("2d");
    const speedBtn = document.getElementById("speed-btn");

    let width, height;
    let score = 0, round = 1, isPlaying = false;
    let totalBallCount = 1;
    let balls = [], bricks = [], items = [], particles = [];
    let isShooting = false, aiming = false;
    let timeScale = 1;
    let cannon = { x: 0, y: 0, angle: -Math.PI / 2 };
    let extraBallsThisRound = 0;
    let gameStartTime = null;
    let best = 0, startBest = 0, combo = 0, shotsLeft = 0, shotCd = 0, shake = 0, lastSfx = 0;
    let paused = false, looping = false, landX = null, muted = false, actx = null, texts = [];
    const R = 6, MIN_A = 0.14;
    const infoEl = document.getElementById("ballInfo");
    const stars = Array.from({ length: 45 }, () => ({ x: Math.random(), y: Math.random(), s: Math.random() * 1.6 + 0.4, p: Math.random() * 6 }));
    try { best = +localStorage.getItem("nsBest") || 0; muted = localStorage.getItem("nsMute") === "1"; } catch (e) {}

    /* ─── RESIZE ─────────────────────────── */
    function resize() {
        const c = document.getElementById("game-container");
        width = c.clientWidth;
        height = c.clientHeight;
        canvas.width  = width;
        canvas.height = height;
        cannon.x = width / 2;
        cannon.y = height - 60;
    }
    window.addEventListener("resize", resize);
    resize();

    /* ─── SPEED ──────────────────────────── */
    function toggleSpeed() {
        timeScale = (timeScale === 1) ? 3 : 1;
        speedBtn.innerText = (timeScale === 1) ? "2x" : ">>";
        speedBtn.style.color = timeScale === 1
            ? "var(--neon-yellow)"
            : "var(--neon-green)";
    }

    /* ─── ÇIKIŞ ───────────────────────────── */
    function goBack() {
        isPlaying = false; paused = false; shotsLeft = 0; pauseScr(false);
        document.getElementById('gameOverScreen').style.display = 'none';
        document.getElementById('startScreen').style.display = 'flex';
        document.getElementById('back-btn').style.display = 'none';
    }

    function exitToPortal() {
        window.location.href = "index.html";
    }

    /* ─── SES / DURAKLAT ─────────────────── */
    function sfx(f, d = 0.08, type = "sine", v = 0.05) {
        if (muted) return;
        try {
            actx = actx || new (window.AudioContext || window.webkitAudioContext)();
            const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
            o.type = type; o.frequency.value = f;
            g.gain.setValueAtTime(v, t);
            g.gain.exponentialRampToValueAtTime(0.0001, t + d);
            o.connect(g); g.connect(actx.destination);
            o.start(); o.stop(t + d);
        } catch (e) {}
    }
    function syncBtns() {
        document.getElementById("mute-btn").textContent = muted ? "🔇" : "🔊";
        document.querySelectorAll(".best-val").forEach(e => e.textContent = best);
    }
    function toggleMute() {
        muted = !muted;
        try { localStorage.setItem("nsMute", muted ? "1" : "0"); } catch (e) {}
        syncBtns();
    }
    function pauseScr(on) { document.getElementById("pauseScreen").style.display = on ? "flex" : "none"; }
    function togglePause() {
        if (!isPlaying) return;
        paused = !paused;
        pauseScr(paused);
    }
    function startLoop() { if (!looping) { looping = true; requestAnimationFrame(update); } }

    /* ─── GAME START ─────────────────────── */
    function startGame() {
        score = 0; round = 1;
        totalBallCount = 1;
        extraBallsThisRound = 0;
        bricks = []; items = []; balls = []; particles = []; texts = [];
        isPlaying = true; isShooting = false; paused = false;
        shotsLeft = 0; combo = 0; landX = null; startBest = best;
        cannon.x = width / 2; cannon.angle = -Math.PI / 2;
        gameStartTime = new Date();
        updateUI();
        pauseScr(false);
        document.getElementById("startScreen").style.display    = "none";
        document.getElementById("gameOverScreen").style.display = "none";
        document.getElementById("back-btn").style.display       = "flex";
        nextTurn();
        startLoop();
        sfx(520, 0.12, "square", 0.04);
    }

    /* ─── UI ─────────────────────────────── */
    function updateUI() {
        if (score > best) best = score;
        [["score", score], ["round", round], ["ballQty", totalBallCount]].forEach(([id, v]) => {
            const el = document.getElementById(id);
            if (el.innerText != v) {
                el.innerText = v;
                
            }
        });
        syncBtns();
    }

    /* ─── BRICKS ─────────────────────────── */
    function createRow() {
        const cols = 6, gap = 10;
        const brickW = (width - (cols + 1) * gap) / cols;
        const brickH = 35;
        for (let i = 0; i < cols; i++) {
            const x = i * (brickW + gap) + gap, rand = Math.random();
            if (rand > 0.45) {
                const hue = ([0, 28, 52, 140, 172, 205, 262, 320][Math.floor(Math.random() * 8)] + Math.floor(Math.random() * 16)) % 360;
                bricks.push({
                    x, y: 70, w: brickW, h: brickH, hp: round, off: -50, flash: 0,
                    color: `hsl(${hue},45%,36%)`,
                    glowColor: `hsl(${hue},50%,48%)`
                });
            } else if (rand > 0.25) {
                items.push({ x: x + brickW / 2, y: 70 + brickH / 2, r: 12, off: -50, type: 'plus' });
            }
        }
    }

    function nextTurn() {
        bricks.forEach(b => { b.y += 50; b.off -= 50; });
        items.forEach(it => { it.y += 50; it.off -= 50; });
        totalBallCount += extraBallsThisRound;
        extraBallsThisRound = 0;
        createRow();
        isShooting = false;
        timeScale  = 1; combo = 0;
        speedBtn.style.display = "none";
        infoEl.innerText = "Nişan al ve fırlat!";
        updateUI();
        checkGameOver();
    }

    function checkGameOver() {
        try { localStorage.setItem("nsBest", best); } catch (e) {}
        if (bricks.some(b => b.y + b.h > cannon.y - 20)) {
            isPlaying = false;
            sfx(110, 0.6, "sawtooth", 0.08);
            document.getElementById("finalScore").innerText = score;
            document.getElementById("finalRound").innerText = round;
            document.getElementById("finalBalls").innerText = totalBallCount;
            document.getElementById("finalBest").innerText  = best;
            document.getElementById("recordBadge").style.display = (score > startBest && score > 0) ? "block" : "none";
            document.getElementById("gameOverScreen").style.display = "flex";
        }
    }

    /* ─── SAVE SCORE ─────────────────────── */
    function saveScore() {
        const data = {
            oyun:    "Neon Striker Ultimate",
            skor:    score,
            tur:     round,
            toplar:  totalBallCount,
            tarih:   new Date().toLocaleString('tr-TR'),
            sureSaniye: gameStartTime
                ? Math.floor((new Date() - gameStartTime) / 1000)
                : null
        };
        const blob = new Blob(
            [JSON.stringify(data, null, 2)],
            { type: "application/json" }
        );
        const a   = document.createElement("a");
        a.href    = URL.createObjectURL(blob);
        a.download = `neon-striker-skor-${Date.now()}.json`;
        a.click();
        URL.revokeObjectURL(a.href);
    }

    /* ─── LOAD SCORE ─────────────────────── */
    function loadScore(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                if (data.skor !== undefined && data.tur !== undefined && data.toplar !== undefined) {
                    const wasPlaying = isPlaying;
                    score          = data.skor;
                    round          = data.tur;
                    totalBallCount = data.toplar;
                    extraBallsThisRound = 0;
                    bricks = []; items = []; balls = []; particles = [];
                    isPlaying  = true; shotsLeft = 0; combo = 0; paused = false; texts = []; landX = null; startBest = best;
                    isShooting = false;
                    gameStartTime = new Date();
                    updateUI();
                    document.getElementById("startScreen").style.display    = "none";
                    document.getElementById("gameOverScreen").style.display = "none";
                    nextTurn();
                    startLoop();
                } else {
                    alert("Geçersiz kayıt dosyası.");
                }
            } catch {
                alert("Dosya okunamadı.");
            }
        };
        reader.readAsText(file);
        event.target.value = "";
    }

    /* ─── INPUT ──────────────────────────── */
    let down = false;
    function handleInput(e) {
        if (!isPlaying || paused || isShooting) return;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const rect    = canvas.getBoundingClientRect();
        const tx = clientX - rect.left, ty = clientY - rect.top;
        if (ty < cannon.y) {
            const a = Math.atan2(ty - cannon.y, tx - cannon.x);
            cannon.angle = Math.max(-Math.PI + MIN_A, Math.min(-MIN_A, a)); // yatay açıyı engelle
            aiming = true;
        }
    }

    function fire() {
        if (!aiming || isShooting || paused || !isPlaying) return;
        isShooting = true; aiming = false;
        if (landX !== null) { cannon.x = landX; landX = null; }
        shotsLeft = totalBallCount; shotCd = 0; combo = 0;
        infoEl.innerText = "";
        speedBtn.style.display = "block";
    }

    canvas.addEventListener("mousedown",  () => { aiming = false; down = true; });
    canvas.addEventListener("mousemove",  handleInput);
    window.addEventListener("mouseup",    () => { if (down) fire(); down = false; });
    canvas.addEventListener("touchstart", (e) => { e.preventDefault(); aiming = false; down = true; }, { passive: false });
    canvas.addEventListener("touchmove",  handleInput);
    window.addEventListener("touchend",   () => { if (down) fire(); down = false; });
    window.addEventListener("keydown", (e) => {
        if (e.key === "p" || e.key === "P" || e.key === "Escape") togglePause();
        if (e.key === " " && isShooting && !paused) toggleSpeed();
    });
    document.addEventListener("visibilitychange", () => { if (document.hidden && isPlaying && !paused) togglePause(); });

    /* ─── PARTICLES ──────────────────────── */
    function createParticles(x, y, color) {
        for (let i = 0; i < 8; i++) {
            const angle = (Math.PI * 2 / 8) * i + Math.random() * 0.5;
            const speed = 2 + Math.random() * 4;
            particles.push({
                x, y,
                dx: Math.cos(angle) * speed,
                dy: Math.sin(angle) * speed,
                life: 1,
                size: 2 + Math.random() * 3,
                color
            });
        }
    }

    /* ─── DRAW HELPERS ───────────────────── */
    function rr(x, y, w, h, r) {
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
    }

    function lighten(hsl, amount) {
        return hsl.replace(/(\d+)%\)/, (m, n) => `${Math.min(100, parseInt(n) + amount)}%)`);
    }

    function drawBrick(br) {
        const x = br.x, y = br.y + br.off, w = br.w, h = br.h;
        ctx.save();
        ctx.shadowColor = br.glowColor;
        ctx.shadowBlur  = 2 + Math.min(br.hp / Math.max(round, 1), 1) * 4;
        const g = ctx.createLinearGradient(x, y, x, y + h);
        g.addColorStop(0, lighten(br.color, 8));
        g.addColorStop(1, br.color);
        ctx.fillStyle = g; rr(x, y, w, h, 7); ctx.fill();
        ctx.shadowBlur = 0; ctx.strokeStyle = br.glowColor; ctx.lineWidth = 1.2; ctx.stroke();
        ctx.fillStyle = "rgba(255,255,255,0.07)"; rr(x + 3, y + 3, w - 6, h * 0.35, 4); ctx.fill();
        if (br.flash > 0) { br.flash--; ctx.fillStyle = "rgba(255,255,255,0.55)"; rr(x, y, w, h, 7); ctx.fill(); }
        ctx.shadowColor = "rgba(0,0,0,0.8)"; ctx.shadowBlur = 4;
        ctx.fillStyle = "#fff"; ctx.font = "bold 14px 'Orbitron', monospace";
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(br.hp, x + w / 2, y + h / 2 + 1);
        ctx.restore();
    }

    function drawCannon() {
        const t = Date.now();
        ctx.save();
        ctx.shadowColor = "#00e5ff";
        ctx.shadowBlur  = 16;
        ctx.strokeStyle = "rgba(0,229,255,0.5)"; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(cannon.x, cannon.y, 19, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath();
        ctx.arc(cannon.x, cannon.y, 14, 0, Math.PI * 2);
        const baseGrad = ctx.createRadialGradient(cannon.x, cannon.y, 2, cannon.x, cannon.y, 14);
        baseGrad.addColorStop(0, "#fff");
        baseGrad.addColorStop(1, "rgba(0,229,255,0.6)");
        ctx.fillStyle = baseGrad; ctx.fill();
        ctx.translate(cannon.x, cannon.y);
        ctx.rotate(cannon.angle);
        ctx.shadowBlur = 10; ctx.fillStyle = "#00e5ff";
        rr(2, -4.5, 32, 9, 3); ctx.fill();
        ctx.fillStyle = "rgba(255,255,255,0.35)";
        ctx.fillRect(4, -2.5, 28, 3);
        ctx.restore();
        ctx.fillStyle = "rgba(255,255,255,0.7)"; ctx.font = "11px 'Orbitron', monospace";
        ctx.textAlign = "left"; ctx.textBaseline = "middle";
        ctx.fillText("×" + (isShooting ? shotsLeft : totalBallCount), cannon.x + 26, cannon.y + 4);
    }

    function popText(t, x, y, c) { texts.push({ t, x, y, c, life: 1 }); }

    function hitBrick(br, dmg, x, y) {
        br.hp -= dmg; combo++;
        score += 1 + Math.floor(combo / 20);
        createParticles(x, y, br.glowColor || br.color);
        const n = performance.now();
        if (n - lastSfx > 35) { lastSfx = n; sfx(300 + Math.min(combo, 40) * 12, 0.07, "square", 0.025); }
        if (combo % 10 === 0) popText("COMBO ×" + combo, x, y, "#fff01f");
        if (combo >= 5) infoEl.innerText = "COMBO ×" + combo;
        updateUI();
    }

    function collect(it) {
        const col = "#39ff14";
        createParticles(it.x, it.y, col);
        if (it.type === 'plus') {
            extraBallsThisRound++;
            popText("+1 TOP", it.x, it.y, col); sfx(880, 0.12, "sine", 0.05);
        }
    }

        /* ─── MAIN UPDATE LOOP ───────────────── */
    function update() {
        if (!isPlaying) { looping = false; return; }
        if (paused) { requestAnimationFrame(update); return; }
        const now = Date.now();

        // Arka plan + yıldızlar
        ctx.clearRect(0, 0, width, height);
        const bg = ctx.createLinearGradient(0, 0, 0, height);
        bg.addColorStop(0, "rgba(10,20,50,0.9)"); bg.addColorStop(1, "rgba(28,6,42,0.85)");
        ctx.fillStyle = bg; ctx.fillRect(0, 0, width, height);
        ctx.fillStyle = "#9fe9ff";
        stars.forEach(st => {
            st.y += st.s * 0.0003; if (st.y > 1) st.y = 0;
            ctx.globalAlpha = 0.25 + 0.25 * Math.sin(now / 600 + st.p);
            ctx.fillRect(st.x * width, st.y * height, st.s, st.s);
        });
        ctx.globalAlpha = 1;

        ctx.save();
        

        // Top yeni konuma kayar
        if (!isShooting && landX !== null) {
            cannon.x += (landX - cannon.x) * 0.2;
            if (Math.abs(landX - cannon.x) < 0.5) { cannon.x = landX; landX = null; }
        }

        // Tehlike çizgisi
        const lineY = cannon.y - 20;
        const danger = bricks.some(b => b.y + b.h > lineY - 55);
        ctx.save();
        ctx.strokeStyle = danger ? "rgba(255,7,58,0.4)" : "rgba(255,7,58,0.12)";
        ctx.setLineDash([6, 8]); ctx.beginPath(); ctx.moveTo(0, lineY); ctx.lineTo(width, lineY); ctx.stroke();
        ctx.restore();

        // Parçacıklar
        if (particles.length > 300) particles.splice(0, particles.length - 300);
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.dx; p.y += p.dy; p.dx *= 0.95; p.dy *= 0.95; p.life -= 0.03;
            if (p.life <= 0) { particles.splice(i, 1); continue; }
            ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
            ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
        }
        ctx.globalAlpha = 1;

        // Eşyalar (+1 top / bomba / lazer)
        items.forEach(it => {
            it.off *= 0.85; if (Math.abs(it.off) < 0.3) it.off = 0;
            const iy = it.y + it.off;
            const col = "#39ff14", sym = "+";
            ctx.save();
            ctx.shadowColor = col; ctx.shadowBlur = 12;
            ctx.beginPath(); ctx.arc(it.x, iy, it.r, 0, Math.PI * 2);
            ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.stroke();
            ctx.globalAlpha = 0.2;
            ctx.fillStyle = col; ctx.fill(); ctx.globalAlpha = 1;
            ctx.fillStyle = "#fff"; ctx.font = "bold 15px 'Share Tech Mono', monospace";
            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillText(sym, it.x, iy + 1);
            ctx.restore();
        });

        // Nişan çizgisi (tuğlada durur, duvardan yansır)
        if (aiming) {
            let x = cannon.x, y = cannon.y;
            let dx = Math.cos(cannon.angle) * 4, dy = Math.sin(cannon.angle) * 4;
            ctx.save();
            ctx.setLineDash([10, 14]); ctx.lineDashOffset = -now / 25;
            ctx.strokeStyle = "rgba(0,229,255,0.6)"; ctx.lineWidth = 1.5;
            ctx.shadowColor = "#00e5ff"; ctx.shadowBlur = 8;
            ctx.beginPath(); ctx.moveTo(x, y);
            for (let i = 0; i < 300; i++) {
                x += dx; y += dy;
                if (x < 8) { x = 8; dx = -dx; } else if (x > width - 8) { x = width - 8; dx = -dx; }
                if (y < 68) { y = 68; dy = -dy; }
                ctx.lineTo(x, y);
                if (y >= cannon.y) break;
                if (bricks.some(br => br.hp > 0 && x + R > br.x && x - R < br.x + br.w && y + R > br.y && y - R < br.y + br.h)) break;
            }
            ctx.stroke(); ctx.setLineDash([]);
            ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2); ctx.stroke();
            ctx.restore();
        }

        // Toplar sırayla çıkar
        if (shotsLeft > 0 && --shotCd <= 0) {
            balls.push({
                x: cannon.x, y: cannon.y,
                dx: Math.cos(cannon.angle) * 8, dy: Math.sin(cannon.angle) * 8,
                active: true, trail: [], t: 0
            });
            shotsLeft--; shotCd = Math.ceil(6 / timeScale);
            sfx(300, 0.05, "triangle", 0.03);
        }

        // Toplar
        balls.forEach(b => {
            b.trail.push({ x: b.x, y: b.y });
            if (b.trail.length > 8) b.trail.shift();
            if (++b.t > 1500) b.dy += 0.03; // takılırsa yavaşça düşür

            for (let s = 0; s < timeScale && b.active; s++) {
                b.x += b.dx; b.y += b.dy;
                if (b.x < 8)         { b.x = 8;         b.dx =  Math.abs(b.dx); }
                if (b.x > width - 8) { b.x = width - 8; b.dx = -Math.abs(b.dx); }
                if (b.y < 68)        { b.y = 68;        b.dy =  Math.abs(b.dy); }
                if (b.y > cannon.y + 10) {
                    b.active = false;
                    break;
                }
                for (const br of bricks) {
                    if (br.hp > 0 && b.x + R > br.x && b.x - R < br.x + br.w && b.y + R > br.y && b.y - R < br.y + br.h) {
                        const px = b.x - b.dx;
                        if (px + R <= br.x || px - R >= br.x + br.w) {
                            b.dx *= -1; b.x = b.dx > 0 ? br.x + br.w + R : br.x - R;
                        } else {
                            b.dy *= -1; b.y = b.dy > 0 ? br.y + br.h + R : br.y - R;
                        }
                        hitBrick(br, 1, b.x, b.y);
                        break;
                    }
                }
                for (let k = items.length - 1; k >= 0; k--) {
                    const it = items[k];
                    if (Math.hypot(b.x - it.x, b.y - it.y) < it.r + 8) { items.splice(k, 1); collect(it); }
                }
            }

            b.trail.forEach((pt, ti) => {
                const a = (ti + 1) / b.trail.length;
                ctx.beginPath(); ctx.arc(pt.x, pt.y, 5 * a, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(0,229,255,${a * 0.35})`; ctx.fill();
            });
            ctx.save();
            ctx.shadowColor = "#bdf6ff"; ctx.shadowBlur = 12;
            ctx.beginPath(); ctx.arc(b.x, b.y, R + 1, 0, Math.PI * 2);
            const bg2 = ctx.createRadialGradient(b.x - 2, b.y - 2, 1, b.x, b.y, 7);
            bg2.addColorStop(0, "#fff"); bg2.addColorStop(1, "rgba(200,230,255,0.8)");
            ctx.fillStyle = bg2; ctx.fill();
            ctx.restore();
        });

        bricks = bricks.filter(br => br.hp > 0);
        balls  = balls.filter(b => b.active);

        if (isShooting && balls.length === 0 && shotsLeft === 0) {
            round++;
            nextTurn();
            sfx(220, 0.1, "triangle", 0.04);
            if (round % 5 === 0) popText("TUR " + round, width / 2, 150, "#fff01f");
        }

        bricks.forEach(br => { br.off *= 0.85; if (Math.abs(br.off) < 0.3) br.off = 0; drawBrick(br); });
        drawCannon();

        // Yüzen yazılar
        for (let i = texts.length - 1; i >= 0; i--) {
            const t = texts[i];
            t.y -= 0.8; t.life -= 0.02;
            if (t.life <= 0) { texts.splice(i, 1); continue; }
            ctx.save();
            ctx.globalAlpha = Math.min(1, t.life * 2);
            ctx.fillStyle = t.c; ctx.shadowColor = t.c; ctx.shadowBlur = 10;
            ctx.font = "bold 14px 'Orbitron', sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillText(t.t, Math.max(50, Math.min(width - 50, t.x)), t.y);
            ctx.restore();
        }

        ctx.restore();
        requestAnimationFrame(update);
    }

    syncBtns();

    /* ── AdSense Lazy Push ── */
    (function() {
        function mgPushAds() {
            document.querySelectorAll('ins.adsbygoogle').forEach(function(ins) {
                if (!ins.getAttribute('data-adsbygoogle-status')) {
                    try { (window.adsbygoogle = window.adsbygoogle || []).push({}); } catch(e) {}
                }
            });
        }
        // Sayfa yüklenince (startScreen görünür)
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', function() { setTimeout(mgPushAds, 800); });
        } else {
            setTimeout(mgPushAds, 800);
        }
        // gameOverScreen açılınca push et
        document.addEventListener('DOMContentLoaded', function() {
            var goScreen = document.getElementById('gameOverScreen');
            if (goScreen) {
                new MutationObserver(function(mutations) {
                    mutations.forEach(function(m) {
                        if (m.type === 'attributes' && m.attributeName === 'style') {
                            if (goScreen.style.display !== 'none') { setTimeout(mgPushAds, 300); }
                        }
                    });
                }).observe(goScreen, { attributes: true });
            }
        });
    })();
</script>
